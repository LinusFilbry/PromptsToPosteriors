# ------- tunable via CLI -------
# which methods to run:
  # naive_eigreasoning: naive question generation using reasoning
  # EIG: BED-LLM methodology
  # llm-driven & oracle-driven: sequential experimental design runs as presented in our work
method_names:
  #  - "naive_eigreasoning"
  #  - "EIG"
  - "llm-driven"
  - "oracle-driven"

# which animals the corresponding methods are run on
