# ------- not tunable via CLI -------
batched_block_size: 50
target_num_questions: 15
num_mc_samples: 15
max_num_samples: 50
min_num_samples: 15
threshold_rejection_probability: 0.2

model_runtime:
  max_model_len: 1500
  max_model_len_thinking: 5000
  thinking_token_budget: 3000
  gpu_memory_util: 0.9
  max_num_seqs: 50

generation_temperature_simple: 1.0
answer_temperature: 0.7
generation_temperature_diverse: 1.3